name: Bug report
description: Report a reproducible problem in SHIELD
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SHIELD version
  - type: input
    id: platform
    attributes:
      label: Platform and version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal information before posting.
