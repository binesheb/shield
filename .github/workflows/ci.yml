name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-features
      - name: Build all binaries
        run: cargo build --locked --release --bins

  windows:
    name: Windows field build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Build CLI and GUI
        run: cargo build --locked --release --bins
      - name: Verify CLI executable
        shell: pwsh
        run: |
          $binary = Join-Path $PWD 'target\release\shield.exe'
          if (-not (Test-Path $binary -PathType Leaf)) { throw 'shield.exe was not produced.' }
          $bytes = [IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid CLI Windows PE executable.' }
          Write-Host "CLI SHA-256:" (Get-FileHash $binary -Algorithm SHA256).Hash
      - name: Verify GUI executable
        shell: pwsh
        run: |
          $binary = Join-Path $PWD 'target\release\shield-ui.exe'
          if (-not (Test-Path $binary -PathType Leaf)) { throw 'shield-ui.exe was not produced.' }
          $bytes = [IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid GUI Windows PE executable.' }
          Write-Host "GUI SHA-256:" (Get-FileHash $binary -Algorithm SHA256).Hash
      - name: Validate installer PowerShell syntax
        shell: pwsh
        run: |
          $path = 'installer\install.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'SHIELD installer has PowerShell parser errors.'
          }
      - name: Validate installer structure
        shell: pwsh
        run: |
          $script = Get-Content -Raw 'installer\install.ps1'
          if (($script | Select-String -Pattern 'function Ensure-Git' -AllMatches).Matches.Count -ne 1) { throw 'Installer Ensure-Git definition is invalid.' }
          if (($script | Select-String -Pattern 'function Ensure-Rust' -AllMatches).Matches.Count -ne 1) { throw 'Installer Ensure-Rust definition is invalid.' }
          if (($script | Select-String -Pattern 'Get-FileHash' -AllMatches).Matches.Count -lt 3) { throw 'Installer hash verification is missing.' }
          if ($script -notmatch 'Remove-Item \$tempDir') { throw 'Installer cleanup is missing.' }
          if ($script -notmatch 'shield-ui.exe') { throw 'GUI deployment is missing.' }
          if ($script -notmatch '\[switch\]\$DeveloperBuild') { throw 'DeveloperBuild override is missing.' }
          if ($script -notmatch 'No verified Windows release is available') { throw 'Production release gate is missing.' }
          if ($script -notmatch 'service install') { throw 'Service deployment is missing.' }
          if ($script -match 'Assert-Command|Required command') { throw 'Unexpected stale installer fragment detected.' }
