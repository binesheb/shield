name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            target: x86_64-pc-windows-msvc
          - name: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Sign Windows binaries
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            throw 'Production release is blocked: WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD secrets are required.'
          }
          $certDir = Join-Path $env:RUNNER_TEMP 'shield-signing'
          New-Item -ItemType Directory -Path $certDir -Force | Out-Null
          $pfx = Join-Path $certDir 'shield.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'Windows SDK signtool.exe was not found.' }
          $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $password = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD /tr $timestamp /td SHA256 "target\${{ matrix.target }}\release\shield.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Signing shield.exe failed.' }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD /tr $timestamp /td SHA256 "target\${{ matrix.target }}\release\shield-ui.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Signing shield-ui.exe failed.' }
          $cliSig = Get-AuthenticodeSignature "target\${{ matrix.target }}\release\shield.exe"
          $guiSig = Get-AuthenticodeSignature "target\${{ matrix.target }}\release\shield-ui.exe"
          if ($cliSig.Status -ne 'Valid' -or $guiSig.Status -ne 'Valid') { throw 'Authenticode signature verification failed.' }
          Write-Host "Publisher:" $cliSig.SignerCertificate.Subject

      - name: Package
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'dist'
          $stage = Join-Path $root 'SHIELD'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\shield.exe" (Join-Path $stage 'shield.exe')
          Copy-Item "target\${{ matrix.target }}\release\shield-ui.exe" (Join-Path $stage 'shield-ui.exe')
          Copy-Item README.md (Join-Path $stage 'README.md')
          Copy-Item SECURITY.md (Join-Path $stage 'SECURITY.md')
          $zip = Join-Path $PWD "shield-windows-${{ matrix.name }}.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii (Join-Path $PWD 'sha256-${{ matrix.name }}.txt')

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'shield-windows-${{ matrix.name }}.zip'

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: shield-windows-${{ matrix.name }}
          path: |
            shield-windows-${{ matrix.name }}.zip
            sha256-${{ matrix.name }}.txt

  publish:
    name: Publish GitHub release
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shield-windows-*
          merge-multiple: true
          path: release

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -like 'sha256-*.txt' }
          gh release create "${{ github.ref_name }}" $assets.FullName --title "SHIELD ${{ github.ref_name }}" --generate-notes
