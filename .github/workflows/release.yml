name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            target: x86_64-pc-windows-msvc
          - name: arm64
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'dist'
          $stage = Join-Path $root 'SHIELD'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\shield.exe" (Join-Path $stage 'shield.exe')
          Copy-Item "target\${{ matrix.target }}\release\shield-ui.exe" (Join-Path $stage 'shield-ui.exe')
          Copy-Item README.md (Join-Path $stage 'README.md')
          Copy-Item SECURITY.md (Join-Path $stage 'SECURITY.md')
          $zip = Join-Path $PWD "shield-windows-${{ matrix.name }}.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii (Join-Path $PWD 'sha256-${{ matrix.name }}.txt')

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'shield-windows-${{ matrix.name }}.zip'

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: shield-windows-${{ matrix.name }}
          path: |
            shield-windows-${{ matrix.name }}.zip
            sha256-${{ matrix.name }}.txt

  publish:
    name: Publish GitHub release
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shield-windows-*
          merge-multiple: true
          path: release

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -like 'sha256-*.txt' }
          gh release create "${{ github.ref_name }}" $assets.FullName --title "SHIELD ${{ github.ref_name }}" --generate-notes
